<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRZM</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f6f8,#101216);--panel:light-dark(#fff,#181b21);--panel2:light-dark(#eef0f4,#20242c);--text:light-dark(#17191e,#f4f6f8);--muted:light-dark(#6b7280,#9aa2b1);--border:light-dark(#dfe3e8,#303641);--accent:#7c5cff;--accent2:#9a82ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.root{min-height:100vh;background:var(--bg)}.top{height:64px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:21px;color:var(--accent);letter-spacing:-.5px}.search{flex:1;max-width:560px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);outline:none}.nav{display:flex;gap:8px;margin-left:auto}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:220px minmax(0,760px) 250px;gap:22px;max-width:1260px;margin:auto;padding:25px 20px}.side,.right{position:sticky;top:89px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:650}.side button.active,.side button:hover{background:var(--panel2);color:var(--text)}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}.hero{padding:24px;background:linear-gradient(135deg,#21184f,#151923 55%,#241c46);color:#fff;border:0}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:#c9c3dc}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent}.tabs button.active{color:var(--text);border-color:var(--accent)}.posthead{display:flex;gap:11px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#ff5caa);display:grid;place-items:center;color:#fff;font-weight:900}.posttitle{font-size:18px;font-weight:800}.meta{color:var(--muted);font-size:13px}.postbody{margin:16px 0;line-height:1.55}.actions{display:flex;gap:8px}.actions button{background:var(--panel2);border:0;color:var(--muted);padding:8px 11px;border-radius:8px;cursor:pointer}.actions button:hover{color:var(--text)}.comment{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;gap:10px}.comment input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px}.game{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--border)}.thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#2e244d,#684fff);flex:none}.small{font-size:13px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:20;padding:20px}.modal.open{display:grid}.modalbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}.modalbox input,.modalbox textarea{width:100%;margin:7px 0 13px;padding:11px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}.modalbox textarea{min-height:130px;resize:vertical}.row{display:flex;justify-content:flex-end;gap:8px}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.side,.right{display:none}.top{padding:0 12px}.nav .hide{display:none}}
</style></head>
<body><div class="root">
<header class="top"><div class="logo">TRZM</div><input id="search" class="search" placeholder="Search games, creators, posts..."><div class="nav"><button class="btn hide" onclick="showTab('discover')">Discover</button><button class="btn primary" onclick="openComposer()">+ Create</button><button class="btn" onclick="alert('Demo account: AlexDev')">Account</button></div></header>
<div class="layout"><aside class="side"><button class="active" onclick="showTab('home')">🏠 Home</button><button onclick="showTab('discover')">🎮 Discover</button><button onclick="showTab('following')">👥 Following</button><button onclick="showTab('profile')">👤 My Profile</button><hr style="border:0;border-top:1px solid var(--border);margin:14px 0"><div class="small" style="padding:8px 12px">COMMUNITY</div><button>💬 Discussions</button><button>🏆 Leaderboards</button><button>📰 Updates</button></aside>
<main id="main"></main><aside class="right"><div class="card"><b>Trending games</b><div id="games"></div></div><div class="card"><b>About TRZM</b><p class="small">A community for sharing games, devlogs, art, and updates.</p></div></aside></div>
<div id="modal" class="modal"><div class="modalbox"><h2>Create a post</h2><label>Title</label><input id="ptitle" placeholder="My new game update"><label>Content</label><textarea id="pbody" placeholder="Tell the community what you made..."></textarea><label>Type</label><select id="ptype" style="width:100%;padding:10px;margin:7px 0 16px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px"><option>Devlog</option><option>Game</option><option>Art</option><option>Announcement</option></select><div class="row"><button class="btn" onclick="closeComposer()">Cancel</button><button class="btn primary" onclick="createPost()">Publish</button></div></div></div>
<script>
const seed=[{id:1,title:'Neon Drift — Update 0.8',body:'New track, improved drifting, controller support, and a bunch of bug fixes. Let me know what you think!',type:'Devlog',user:'PixelForge',likes:42,comments:['The new track is sick!','Controller support finally!'],time:'2h ago'},{id:2,title:'I made a tiny horror game 👻',body:'It took me three weeks to make this little first-person horror game. Free to play — feedback welcome!',type:'Game',user:'NightByte',likes:27,comments:['The atmosphere is awesome.'],time:'5h ago'},{id:3,title:'Character concept art',body:'Working on the cast for my next RPG. Which design should I develop first?',type:'Art',user:'MochiDev',likes:19,comments:[],time:'Yesterday'}];
let posts=JSON.parse(localStorage.getItem('trzm_posts')||'null')||seed;let tab='home';
function save(){localStorage.setItem('trzm_posts',JSON.stringify(posts))}function showTab(t){tab=t;document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));render()}function render(){let main=document.getElementById('main');let filtered=posts; if(tab==='discover')filtered=[...posts].sort((a,b)=>b.likes-a.likes); if(tab==='following')filtered=posts.filter(p=>['PixelForge','MochiDev'].includes(p.user)); if(tab==='profile')filtered=posts.filter(p=>p.user==='AlexDev'); let search=document.getElementById('search').value.toLowerCase();if(search)filtered=filtered.filter(p=>(p.title+p.body+p.user+p.type).toLowerCase().includes(search));let heading=tab==='home'?'Community feed':tab==='discover'?'Discover':tab==='following'?'Following':'AlexDev';main.innerHTML=`<div class="hero"><h1>${heading}</h1><p>Share games, devlogs, art, and updates with other creators.</p></div><div class="tabs"><button class="active">Latest</button><button onclick="showTab('discover')">Popular</button><button>Games</button><button>Devlogs</button></div>${filtered.length?filtered.map(postHTML).join(''):'<div class="card empty">Nothing here yet. Create the first post.</div>'}`;document.getElementById('games').innerHTML=['Neon Drift','Dungeon Zero','Skyline 98'].map((g,i)=>`<div class="game"><div class="thumb"></div><div><b>${g}</b><div class="small">${[128,91,73][i]} followers</div></div></div>`).join('')}
function postHTML(p){return `<article class="card"><div class="posthead"><div class="avatar">${p.user[0]}</div><div><div class="posttitle">${esc(p.title)}</div><div class="meta">${esc(p.user)} · ${p.type} · ${p.time}</div></div></div><div class="postbody">${esc(p.body)}</div><div class="actions"><button onclick="like(${p.id})">♥ ${p.likes}</button><button onclick="focusComment(${p.id})">💬 ${p.comments.length}</button><button>↗ Share</button></div><div id="comments-${p.id}">${p.comments.slice(-3).map(c=>`<div class="comment"><div class="avatar" style="width:30px;height:30px;font-size:12px">U</div><div><b>Community member</b><div>${esc(c)}</div></div></div>`).join('')}</div><div class="comment"><div class="avatar" style="width:30px;height:30px;font-size:12px">A</div><input id="comment-${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')comment(${p.id})"><button class="btn" onclick="comment(${p.id})">Post</button></div></article>`}
function like(id){let p=posts.find(x=>x.id===id);p.likes++;save();render()}function comment(id){let i=document.getElementById('comment-'+id),v=i.value.trim();if(!v)return;posts.find(x=>x.id===id).comments.push(v);save();render()}function focusComment(id){setTimeout(()=>document.getElementById('comment-'+id)?.focus(),50)}function openComposer(){document.getElementById('modal').classList.add('open');document.getElementById('ptitle').focus()}function closeComposer(){document.getElementById('modal').classList.remove('open')}function createPost(){let title=document.getElementById('ptitle').value.trim(),body=document.getElementById('pbody').value.trim(),type=document.getElementById('ptype').value;if(!title||!body)return alert('Add a title and content.');posts.unshift({id:Date.now(),title,body,type,user:'AlexDev',likes:0,comments:[],time:'Just now'});save();closeComposer();document.getElementById('ptitle').value='';document.getElementById('pbody').value='';showTab('home')}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('search').addEventListener('input',render);render();
</script></div></body></html>
